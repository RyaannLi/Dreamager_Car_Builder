<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreenager Car Builder</title>
  <link rel="stylesheet" href="style.css">
  <script type = "module" src="script.js"></script>
</head>
<body>
  <main>
    <h1>Dreenager Car Builder</h1>
    <p>Nissan Silvia S15</p>

    <div class="builder">
        <div id="paint-preview"></div>

        <div class="controls">
            <label for="paint-color">Choose your paint:</label>
            <input type="color" id="paint-color" value="#491dd7">
            <button id="reset-paint">Reset Paint</button>
        </div>
    </div>
  </main>
</body>
</html>
