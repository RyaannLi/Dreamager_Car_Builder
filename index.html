<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreenager Car Builder</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Dreenager Car Builder</h1>
    <p>Nissan Silvia S15</p>

    <div class="builder"><!-- groups lines 15-22 together so they're all in a line -->
        <div id="paint-preview">Paint preview</div>

        <div class = "controls">
            <label for="paint-color">Choose your paint:</label>
            <input type="color" id="paint-color" value="#8054ff">
            <button id="paint-reset">Reset Paint</button>
        </div>
    </div>
  </main>
</body>
</html>
